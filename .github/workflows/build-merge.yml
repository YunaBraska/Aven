name: "🔄 CD · Release Snapshot"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: aven-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  snapshot:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_snapshot.yml@1ebb6d9e98930d0ede2aaf9bf0c648010d44d66e
    with:
      ref: ${{ github.sha }}
