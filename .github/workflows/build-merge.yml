name: "🔄 CD · Release Snapshot"

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/Page/**
      - .github/workflows/product-pages.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: aven-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  snapshot:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_snapshot.yml@469372e592d87a003dbfae15ef8d50194bcea7e5
    with:
      ref: ${{ github.sha }}
