name: "🔄 CD · Release Snapshot"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: aven-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  snapshot:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_snapshot.yml@807b79318cc6e4242e6fc6b4be358b58218d96ab
    with:
      ref: ${{ github.sha }}
