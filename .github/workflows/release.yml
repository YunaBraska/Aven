# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_release.yml@64ded0126229fc7bb53ffa1cbd3b8ce1ce2ed80c
    with:
      force: ${{ inputs.force }}
    secrets: inherit
