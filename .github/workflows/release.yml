# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_release.yml@1ebb6d9e98930d0ede2aaf9bf0c648010d44d66e
    with:
      force: ${{ inputs.force }}
    secrets: inherit
