# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_release.yml@a989b376b6f85e9643c12231a44640036f8ad1c2
    with:
      force: ${{ inputs.force }}
    secrets: inherit
